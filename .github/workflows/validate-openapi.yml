name: Validate OpenAPI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REDOCLY_TELEMETRY: "off"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI specification
        run: npx redocly lint openapi.yaml --config redocly.yaml

      - name: Bundle OpenAPI specification
        run: npx redocly bundle openapi.yaml --config redocly.yaml > /dev/null

      - name: Regenerate AI docs (llms.txt, llms-full.txt, llms/)
        run: npm run build

      - name: Fail if AI docs are out of date
        run: |
          if [ -n "$(git status --porcelain -- llms.txt llms-full.txt llms)" ]; then
            git status --porcelain -- llms.txt llms-full.txt llms
            echo "::error::Generated AI docs are stale. Run 'npm run build' and commit the result."
            exit 1
          fi
