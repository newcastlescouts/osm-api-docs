<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSM API Docs</title>
  <meta name="description"
    content="Unofficial, community-maintained OpenAPI reference for the Online Scout Manager (OSM) API." />
  <link rel="icon" href="https://newcastlescouts.org.uk/favicon.ico" />
  <!-- Machine-readable versions of these docs -->
  <link rel="alternate" type="text/markdown" title="llms.txt" href="llms.txt" />
  <link rel="alternate" type="application/yaml" title="OpenAPI spec" href="openapi.yaml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* Tokens and header/banner styles mirror the district website
       (district-website/app/assets/css/tokens.css, AppHeader.vue, SiteBanner.vue). */
    :root {
      --purple: #7413dc;
      --purple-dark: #5f0fb4;
      --purple-05: #f6effd;
      --purple-40: #c7a1f1;
      --navy: #003882;
      --white: #ffffff;
      --black: #000000;
      --grey-200: #e4e4e7;
      --grey-900: #131316;
      --font-brand: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --wrap: 1320px;
      --gutter: clamp(1.25rem, 0.5rem + 3vw, 2.5rem);
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --dur-fast: 120ms;
      --dur: 200ms;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--white);
      color: var(--grey-900);
      font-family: var(--font-brand);
    }

    .wrap {
      width: 100%;
      max-width: var(--wrap);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    :focus-visible {
      outline: 3px solid var(--purple);
      outline-offset: 2px;
    }

    .skip {
      position: absolute;
      left: -9999px;
      top: 12px;
      z-index: 10;
      background: var(--black);
      color: var(--white);
      padding: 12px 16px;
      font-weight: 700;
    }

    .skip:focus {
      left: 16px;
    }

    /* ---- Header ---- */
    .hdr {
      background: var(--white);
      border-bottom: 1px solid var(--grey-200);
    }

    .hdr__inner {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 24px;
      min-height: 84px;
      padding-block: 12px;
    }

    .hdr__brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      min-height: 44px;
      color: var(--black);
      text-decoration: none;
      margin-inline-end: auto;
    }

    .lockup {
      display: block;
      width: 190px;
      height: auto;
    }

    .lockup__name {
      font-family: var(--font-brand);
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.01em;
    }


    /* Sits level with the "Scouts" wordmark, not the middle of the lock-up: the
       lock-up's clear space and "City of Newcastle" line pull its box centre low. */
    .hdr__product {
      color: var(--purple);
      font-weight: 800;
      font-size: 1rem;
      line-height: 1;
      white-space: nowrap;
      padding-left: 14px;
      border-left: 2px solid var(--purple-40);
      padding-block: 4px;
      transform: translateY(-4px);
    }

    .hdr__nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 24px;
    }

    .hdr__link {
      font-size: 1rem;
      font-weight: 700;
      color: inherit;
      text-decoration: none;
      padding-block: 8px;
      border-bottom: 4px solid transparent;
      white-space: nowrap;
      transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }

    .hdr__link:hover {
      border-bottom-color: var(--purple-40);
    }

    .hdr__link[aria-current="page"] {
      border-bottom-color: var(--purple);
      color: var(--purple);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 0.75rem 1.5rem;
      border: 2px solid transparent;
      border-radius: 0;
      background: var(--purple);
      color: var(--white);
      font-weight: 700;
      font-size: 1rem;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color var(--dur-fast) var(--ease);
    }

    .btn:hover {
      background: var(--purple-dark);
    }

    /* Below 960px the nav drops onto its own row under the logo and button. */
    @media (max-width: 959px) {
      .hdr__nav {
        order: 3;
        width: 100%;
        gap: 4px 20px;
      }
    }

    /* Phones: logo and button share a row, the nav sits on one row below, and the
       banner tightens up, so the docs start well above the fold. */
    @media (max-width: 600px) {
      .hdr__inner {
        min-height: 0;
        gap: 2px 12px;
        padding-block: 8px;
      }

      .lockup {
        width: 108px;
      }

      .hdr__brand {
        gap: 10px;
        flex-basis: 100%;
      }

      .hdr__nav {
        width: auto;
      }

      .hdr__link--wide {
        display: none;
      }

      .btn {
        order: 4;
        margin-left: auto;
      }

      .hdr__product {
        font-size: 0.875rem;
        padding-left: 10px;
        transform: translateY(-2px);
      }

      .hdr__nav {
        gap: 0 18px;
      }

      .hdr__link {
        font-size: 0.9375rem;
      }

      .hdr__link[aria-current="page"] {
        display: none;
      }

      .btn {
        min-height: 40px;
        padding: 0.5rem 0.75rem;
        font-size: 0.9375rem;
        gap: 6px;
      }

      .btn__long {
        display: none;
      }

      .banner {
        font-size: 0.875rem;
      }

      .banner__inner {
        padding-block: 8px;
        gap: 0 12px;
      }

      .banner__text {
        flex-basis: 100%;
      }

      .banner__link {
        min-height: 36px;
      }
    }

    /* ---- Notice banner (district SiteBanner, "info" style). Not yellow: that is reserved for safeguarding. ---- */
    .banner {
      background: var(--navy);
      color: var(--white);
      font-size: 1rem;
    }

    .banner__inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      padding-block: 12px;
    }

    .banner__text {
      margin: 0;
      line-height: 1.3;
      flex: 1 1 32rem;
    }

    .banner__text strong {
      font-weight: 900;
      margin-inline-end: 8px;
    }

    .banner__link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      font-weight: 900;
      color: inherit;
    }

    #redoc-error {
      padding: 24px var(--gutter);
      color: #d41c00;
    }

    @media print {

      .hdr,
      .banner {
        display: none;
      }
    }
  </style>
</head>
