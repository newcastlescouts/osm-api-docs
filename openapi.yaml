            enum: [ manifest ]
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Activity ID.
        - name: activity_id
          in: query
          required: true
          schema:
            type: string
          description: Activity ID.
        - name: activity_unique_id
          in: query
          required: false
          schema:
            type: string
          description: The activity version's unique ID (`details.id` from `getActivity`).
        - name: section_id
