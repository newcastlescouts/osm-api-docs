    V3Envelope:
      type: object
      description: |
        Standard wrapper used by `/v3/` endpoints and newer `/ext/` actions.
        `data` and `meta` are endpoint-specific; an empty `meta` is serialised
        as `[]` rather than `{}`.
      properties:
        status:
          type: boolean
        error:
          type: string
          nullable: true
        data:
          description: Endpoint-specific payload (object, array, or null).
        meta:
          description: Endpoint-specific metadata (object, or `[]` when empty).
      additionalProperties: true
    ItemStore:
      type: object
      description: |
        Dojo data store format used by older `/ext/` endpoints: `identifier`
        names the unique key in each item, `label` the display field.
      properties:
        identifier:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    GridStructure:
      type: array
      description: |
        Dojo grid layout: an array of column blocks, each with `rows` of column
        definitions (`name`, `field`, `width`, optional `formatter`, `tooltip`,
        `editable`). A block with `noscroll: true` is the frozen left block.
      items:
        type: object
        properties:
          rows:
            type: array
            items:
              type: object
              additionalProperties: true
          noscroll:
            type: boolean
        additionalProperties: true
