  /ext/events/summary/:
    get:
      summary: List events or the event audit log
      tags:
        - Events
      description: |
        - `get` — events for the term with headline attendance counts
          (`yes` = total attending, split into `yes_members` / `yes_yls` /
          `yes_leaders`; plus `no`, `invited`, `reserved`, `shown`). Dates come
          in both UK (`dd/mm/yyyy`) and ISO (`startdate_g`) forms. `cost` is a
          decimal string in pounds.
        - `getEvents` — a lightweight list (`eventid`, `name`, `startdate`,
          `attachments`). With `onlyArchived=1`, returns archived events only.
        - `getAudit` — recent attendance changes made by parents through the
          Parent Portal (`type=portal`), newest first.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ get, getEvents, getAudit ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: false
          schema:
            type: string
          description: Term ID (`get`, `getEvents`).
        - name: onlyArchived
          in: query
          required: false
          schema:
            type: string
            enum: [ "1" ]
          description: "`getEvents` — only return archived events."
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [ portal ]
          description: "`getAudit` — audit source (observed `portal`)."
      responses:
        "200":
          description: Dojo item store of events or audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemStore"
              examples:
                get:
                  summary: Events with attendance counts (action=get)
                  value:
                    identifier: eventid
                    items:
                      - eventid: "1700001"
                        name: "Winter Sleepover"
                        date: "06/12/2025"
                        startdate_g: "2025-12-06"
                        startdate: "06/12/2025"
                        enddate: "07/12/2025"
                        starttime: "11:00:00"
                        endtime: "14:00:00"
                        cost: "40.00"
                        location: "Riverside Scout Hut"
                        approval_status: null
                        rota_offered: 0
                        rota_accepted: 0
                        rota_required: null
                        yes: 18
                        yes_members: 15
                        yes_yls: 0
                        yes_leaders: 3
                        reserved: 0
                        no: 2
                        absent: 0
                        invited: 4
                        shown: 0
                        x: 1
                getEvents:
                  summary: Archived events (action=getEvents&onlyArchived=1)
                  value:
                    identifier: eventid
                    label: name
                    items:
                      - eventid: "1700002"
                        name: "District Camp"
                        startdate: "2024-06-19"
                        attachments: false
                getAudit:
                  summary: Parent Portal changes (action=getAudit&type=portal)
                  value:
                    identifier: auditid
                    items:
                      - auditid: "50000001"
                        eventid: "1700001"
                        name: "Winter Sleepover"
                        firstname: "Jamie"
                        lastname: "River"
                        photo_guid: "00000000-0000-0000-0000-000000000000"
                        member_id: "3100001"
                        updatedate: "2025-11-07 13:16:11"
                        date: "07/11/2025 13:16"
                        generic_date: "2025-11-07 13:16:11"
                        updatedby: "Jamie"
