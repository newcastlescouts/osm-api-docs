components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OSM uses OAuth 2.0 Authorization Code flow. Create an OAuth application
        at **Settings → My Account Details → Developer Tools** in the OSM UI to
        obtain your `client_id` and `client_secret`.
      flows:
        authorizationCode:
          authorizationUrl: https://www.onlinescoutmanager.co.uk/oauth/authorize
          tokenUrl: https://www.onlinescoutmanager.co.uk/oauth/token
          refreshUrl: https://www.onlinescoutmanager.co.uk/oauth/token
          scopes:
            section:member:read: Read member data for sections you have access to
            section:member:write: Update member data (patrols, ranks, fields)
            section:badge:read: Read badge records and progress
            section:event:read: Read events and programme data
            section:programme:read: Read programme summaries and meetings
  schemas:
    StartupConfigPayload:
      type: object
      properties:
        status:
          type: boolean
        error:
          nullable: true
        data:
          type: object
          properties:
            site_type:
              type: string
              description: Site variant identifier (e.g., `scouts`).
            site_folder:
              type: string
              description: Server-side folder path for site-specific assets.
            siteConfig:
              type: object
              description: Global feature flags, upgrade pricing, section type definitions, and configuration.
              properties:
                expense_cards:
                  type: object
                  additionalProperties: true
                online_payment_gateways:
                  type: array
                  items:
                    type: string
                beta:
                  type: array
                  description: Beta features available for opt-in.
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      role:
                        type: string
                      release_ts:
                        type: integer
                      feedback:
                        type: object
                        additionalProperties: true
                    additionalProperties: true
                boltons:
                  type: object
                  description: Short-code to bolton name mapping.
                  additionalProperties:
                    type: string
                upgrade_config:
                  type: object
                  description: Subscription feature prices, keyed by feature name.
                  additionalProperties:
                    type: object
                    properties:
                      price:
                        type: number
                sms_prices:
                  type: object
                  description: SMS bundle prices keyed by credit quantity.
                  additionalProperties:
                    type: number
                recipes:
                  type: object
                  description: Enumerated values for the recipe planner.
                  additionalProperties:
                    type: array
                    items:
                      type: string
                section_types:
                  type: object
                  description: Human-readable section type names keyed by country code then section type slug.
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                badge_types:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                section_type_setup:
                  type: object
                  description: Per-section-type capability flags and badge definitions.
                  additionalProperties:
                    type: object
                    additionalProperties: true
                kill:
                  type: object
                  description: Feature kill-switch states (all `false` means all services active).
                  additionalProperties:
                    type: boolean
                buy_links:
                  type: object
                  additionalProperties:
                    type: string
                risk_assessments_config:
                  type: object
                  additionalProperties: true
                communicatable_contact_groups:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                email_template_colours:
                  type: array
                  items:
                    type: string
                campaign_template_designs:
                  type: array
                  items:
                    type: string
                remove_member_allowed_functions:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
              additionalProperties: true
            patrolLabels:
              type: object
              description: Patrol/group label names per section type.
              additionalProperties:
                type: object
                properties:
                  patrol:
                    type: string
                  patrols:
                    type: string
            patrolRoles:
              type: object
              description: |
                Patrol role definitions per section type. Youth sections use an array ordered by level;
                adult sections use an object keyed by level number.
              additionalProperties:
                oneOf:
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
                  - type: object
                    additionalProperties:
                      type: object
                      additionalProperties: true
            extraSectionTypes:
              type: object
              description: Display names for non-standard section types.
              additionalProperties:
                type: string
            featurelevels:
              type: object
              description: Minimum subscription level required to access each feature.
              additionalProperties:
                type: integer
            changedlevels:
              type: array
              items:
                type: object
                additionalProperties: true
            availableRoles:
              type: object
              description: Global role slugs mapped to display names.
              additionalProperties:
                type: string
            globalAccessRoles:
              type: array
              description: Access control rules granting global roles specific access types.
              items:
                type: object
                properties:
                  user_role:
                    type: string
                  access_type:
                    type: string
                  id:
                    type: string
                additionalProperties: true
            terminology:
              type: object
              description: Hierarchy level names for the site (Group, District, County, etc.).
              additionalProperties:
                type: string
            forms:
              type: array
              description: Dynamic form definitions (accident forms, medication history, etc.).
              items:
                type: object
                additionalProperties: true
            default_terminology:
              type: object
              additionalProperties:
                type: string
            leaderPatrolIds:
              type: array
              description: Patrol IDs reserved for leaders (typically -2 and -3).
              items:
                type: integer
          additionalProperties: true
        meta:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    StartupDataPayload:
      type: object
      properties:
        status:
          type: boolean
        error:
          nullable: true
        data:
          type: object
          properties:
            cdn:
              type: string
              description: Base CDN URL for static assets.
            resources:
              type: array
              items:
                type: string
              description: Ordered list of JS/CSS resource paths to load on startup.
            config_hash:
              type: string
              description: Hash representing the current server-side configuration state.
            required_cdn_built_files:
              type: object
              additionalProperties:
                type: string
              description: Named CDN file URLs required for the app (e.g., `osm.js`, `react.js`).
            cache_bust:
              type: string
              description: Query string cache-busting token derived from built file hashes.
            globals:
              type: object
              properties:
                post_login_action:
                  description: Action to perform after login, or `false` if none.
                  oneOf:
                    - type: boolean
                    - type: string
                theme:
                  type: string
                  description: UI theme name (e.g., `blue`).
                userid:
                  type: integer
                  description: Authenticated user's numeric ID.
                roles:
                  type: array
                  description: Sections the user has access to, including permissions and config.
                  items:
                    type: object
                    properties:
                      groupname:
                        type: string
                      groupid:
                        type: string
                      group_country:
                        type: string
                      sectionid:
                        type: string
                      sectionname:
                        type: string
                      section:
                        type: string
                        description: Section type slug (e.g., `cubs`, `scouts`, `adults`, `waiting`).
                      isDefault:
                        type: string
                      permissions:
                        type: object
                        additionalProperties: true
                      sectionConfig:
                        type: object
                        additionalProperties: true
                    additionalProperties: true
                active_user_member:
                  description: Whether the user is also a member record, or `false`.
                  oneOf:
                    - type: boolean
                    - type: integer
                associated_member_id:
                  description: Associated member ID if applicable, or `false`.
                  oneOf:
                    - type: boolean
                    - type: integer
                email:
                  type: string
                firstname:
                  type: string
                lastname:
                  type: string
                fullname:
                  type: string
                preferences:
                  type: object
                  additionalProperties: true
                  description: User-specific UI and behavioural preferences.
                member_access:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties: true
                  description: Sections where the user has parent-portal member access, keyed by section ID.
                member_access_unactivated:
                  description: Whether any member access is pending activation.
                  oneOf:
                    - type: boolean
                    - type: object
                      additionalProperties: true
                terms:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: object
                      properties:
                        termid:
                          type: string
                        sectionid:
                          type: string
                        name:
                          type: string
                        startdate:
                          type: string
                        enddate:
                          type: string
                        master_term:
                          nullable: true
                        past:
                          type: boolean
                      additionalProperties: true
                  description: Terms for each section, keyed by section ID.
                global_roles:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                hasSectionAccess:
                  type: boolean
                notepads:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                sockets:
                  type: string
                  description: Comma-separated `sectionid-token` pairs for WebSocket connections.
                user_socket:
                  type: string
                  description: Personal WebSocket token for the authenticated user.
                session_id:
                  type: string
                security_prompt:
                  type: boolean
                user_has_image:
                  type: string
                  description: Path to the user's profile photo.
                user_hash:
                  type: string
                  description: HMAC hash used for client-side identity verification.
                user_hash_legacy:
                  type: string
                language:
                  type: string
                  example: "en-GB"
                gamification:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      total_steps:
                        type: integer
                      steps_completed:
                        type: integer
                      id:
                        oneOf:
                          - type: integer
                          - type: string
                    additionalProperties: true
                gamification_rank:
                  type: integer
                gamification_total:
                  type: integer
                features_used:
                  type: array
                  items:
                    type: string
                  description: Log of feature interactions recorded for this user account.
                unread_message_count:
                  type: integer
                client_time:
                  type: string
                  description: Client Unix timestamp in milliseconds at the time of the request.
              additionalProperties: true
            dojo:
              type: object
              properties:
                cacheBust:
                  type: string
                locale:
                  type: string
              additionalProperties: true
          additionalProperties: true
        meta:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    MembersList:
      type: object
      properties:
        identifier:
          type: string
        photos:
          type: boolean
        items:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [ identifier, items ]
      additionalProperties: true
