        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - "member_ids[0]"
              properties:
                "member_ids[0]":
                  type: integer
                  description: Scout ID of the member to check. Additional members can be sent as `member_ids[1]`, `member_ids[2]`, etc.
            example:
              "member_ids[0]": 3100005
      responses:
        "200":
          description: Removal warnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  error:
                    nullable: true
                  data:
                    type: object
                    properties:
                      payments:
                        type: boolean
                        description: Whether the member has outstanding payments.
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      ok:
                        type: boolean
              example:
                status: true
                error: null
                data:
                  payments: false
                meta:
                  ok: true
