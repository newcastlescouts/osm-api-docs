  /ext/members/attendance/:
    get:
      summary: Get attendance data, register structure, or badge requirements
      tags:
        - Attendance
      description: |
        Attendance endpoints share this path with different `action` values.

        - `get` — the register: one row per member with a `yyyy-mm-dd` key for
          each meeting they have a mark for (`Yes` / `No`), plus `meetings`
          (date → meeting title), `visitors` and `parent_rota` (both objects,
          empty when unused).
        - `structure` — the Dojo grid layout for the register: a frozen name
          block, then one column per meeting date (`tooltip` is the meeting title).
        - `getAttendanceBadgeRequirements` — badge requirements linked to the
          meeting on `date`. With `v=2` the response is an object with `badges`
          (the requirements) and `badges_updated_at` (who last changed the
          meeting's badge links); without `v` an array of requirements is returned.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ get, structure, getAttendanceBadgeRequirements ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: false
          schema:
            type: string
          description: Term ID (required for `get` and `structure`).
        - name: section
          in: query
          required: true
          schema:
            type: string
          description: Section type (e.g., `cubs`).
        - name: nototal
          in: query
          required: false
          schema:
            type: string
          description: Toggle total attendance column (observed `true`).
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Meeting date (required for `action=getAttendanceBadgeRequirements`).
        - name: v
          in: query
          required: false
          schema:
            type: string
            enum: [ "2" ]
          description: "`getAttendanceBadgeRequirements` — response version. `2` returns the `{badges, badges_updated_at}` object."
      responses:
        "200":
          description: Attendance, structure, or badge requirement response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AttendanceList"
                  - $ref: "#/components/schemas/AttendanceBadgeRequirements"
                  - $ref: "#/components/schemas/AttendanceBadgeRequirementsV2"
                  - $ref: "#/components/schemas/GridStructure"
              examples:
                attendanceList:
                  summary: Attendance list (action=get)
                  value:
                    identifier: scoutid
                    label: name
                    items:
                      - "2025-01-07": "Yes"
                        "2025-01-14": "No"
                        total: 1
                        firstname: "Jamie"
                        lastname: "River"
                        photo_guid: "00000000-0000-0000-0000-000000000000"
                        patrolid: 12001
                        patrolleader: "2"
                        patrol: "Blue"
                        dob: "2015-04-22"
                        sectionid: 45002
                        startdate: "2021-09-01"
                        enddate: null
                        age: "10 / 04"
                        patrol_role_level_label: "Sixer"
                        active: true
                        scoutid: 3100001
                        _filterString: "jamie river blue"
                      - "2025-01-07": "Yes"
                        total: 1
                        firstname: "Robert"
                        lastname: "Baden Powell"
                        patrolid: -2
                        patrol: "Leaders"
                        active: true
                        scoutid: 3100010
                    visitors: { }
                    parent_rota: { }
                    meetings:
                      "2025-01-07": "Welcome Back!"
                      "2025-01-14": "Camp Skills Night"
                structure:
                  summary: Register grid layout (action=structure)
                  value:
                    - rows:
                        - name: "First Name"
                          field: firstname
                          width: "100px"
                          formatter: registerBoldFormatter
                        - name: "Last Name"
                          field: lastname
                          width: "100px"
                          formatter: registerBoldFormatter
                      noscroll: true
                    - rows:
                        - name: "2025-01-07"
                          field: "2025-01-07"
                          formatter: doneFormatter
                          width: "110px"
                          tooltip: "Welcome Back!"
                badgeRequirementsV2:
                  summary: Attendance badge requirements (v=2)
                  value:
                    badges:
                      - badge: "0"
                        badge_id: "1002"
                        badge_version: "0"
                        column_id: "200101"
                        badgeName: "Chef"
                        badgetype: "activity"
                        columngroup: "A"
                        columnname: "a"
                        description: "Learn about the main food groups."
                        data: "14/01/2025"
                        eveningid: 9500002
                        meetingdate: "2025-01-14"
                        link_from: "meeting"
                        name: "Food Groups"
                        section: "cubs"
                        sameas_counter: 0
                        sectionid: 45002
                    badges_updated_at:
                      - user_name: "Alex Scout"
                        date_time: "14/01/2025 20:40"
                badgeRequirements:
                  summary: Attendance badge requirements (no v parameter)
                  value:
                    - badge_id: "1593"
                      badgeName: "Communicator"
                      column_id: "100542"
                      name: "Code"
                      meetingdate: "2025-01-14"
                      section: "cubs"
                      sectionid: 12345
    post:
      summary: Update attendance
      tags:
        - Attendance
      description: |
        Marks one or more members present/absent for a meeting date, optionally
        awarding the badge requirements linked to that meeting. The response
        body is the bare JSON literal `true` on success.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ update ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
        - name: termid
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                scouts:
                  type: string
                  description: JSON array of member IDs.
                selectedDate:
                  type: string
                present:
                  type: string
                  description: "`Yes`, `No`, or `Absent` (observed)."
                section:
                  type: string
                sectionid:
                  type: string
                completedBadges:
                  type: string
                  description: JSON array of badge data.
                customData:
                  type: string
                  description: JSON array of custom data updates.
              required: [ scouts, selectedDate, present, section, sectionid ]
              additionalProperties: true
            example:
              scouts: "[3100001]"
              selectedDate: "2025-01-14"
              present: "Yes"
              section: "cubs"
              sectionid: "45002"
              completedBadges: "[]"
              customData: "[]"
      responses:
        "200":
          description: The JSON literal `true` on success.
          content:
            application/json:
              schema:
                type: boolean
              example: true
  /v3/members/attendance/visitors/{sectionid}:
    post:
      summary: Add or update a register visitor
