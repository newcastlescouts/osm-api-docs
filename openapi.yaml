      summary: Activity library
      tags:
        - Programme
      description: |
        OSM's shared activity library.

        - `getActivity` — one activity (`id` + `version`) with its full
          details, attached `files`, available `versions`, suitable `sections`,
          and whether the current user owns it.
        - `searchByNewActivities` — the newest shared activities (up to 100
          `items`; `num` is the total, `query` echoes `newest activities`).
        - `getTags` — every activity tag in use OSM-wide (a very large list —
          over ten thousand entries).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getActivity, searchByNewActivities, getTags ]
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Activity ID (`getActivity`).
        - name: version
          in: query
          required: false
          schema:
            type: string
          description: Activity version (`getActivity`).
        - name: activity_unique_id
          in: query
          required: false
          schema:
            type: string
          description: "`getActivity` — observed `0`."
        - name: section
          in: query
          required: false
          schema:
            type: string
          description: Section type.
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID (`getActivity`).
        - name: section_id
          in: query
          required: false
          schema:
            type: string
