  /ext/programme/:
    get:
      summary: Programme endpoints
      tags:
        - Programme
      description: |
        Programme endpoints share this path with different `action` values.
        Use `getProgrammeSummary` for term overview, `getProgramme` for details,
        `getMembersForParentRota` for parent rota members, or
        `programmeAttachmentsManifest` for attachment metadata.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                getProgrammeSummary,
                getProgramme,
                programmeAttachmentsManifest,
                getMembersForParentRota,
              ]
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: false
          schema:
            type: string
          description: Term ID.
        - name: eveningid
          in: query
          required: false
          schema:
            type: string
          description: Meeting ID.
        - name: section_id
          in: query
          required: false
          schema:
            type: string
          description: Section ID.
        - name: id
          in: query
          required: false
          schema:
            type: string
          description: Meeting ID.
        - name: evening_id
          in: query
          required: false
          schema:
            type: string
          description: Meeting ID.
        - name: verbose
          in: query
          required: false
          schema:
            type: string
          description: Set to `1` to add `badges` and `unavailable_leaders` to each summary item.
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Unknown (observed `/`).
        - name: temp
          in: query
          required: false
          schema:
            type: string
          description: Unknown (observed `false`).
        - name: upload_mode
          in: query
          required: false
          schema:
            type: string
          description: Unknown (observed `programme`).
      responses:
        "200":
          description: Programme response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProgrammeSummary"
                  - $ref: "#/components/schemas/ProgrammeDetails"
                  - $ref: "#/components/schemas/ProgrammeParentRotaMembers"
                additionalProperties: true
              examples:
                programmeSummary:
                  summary: Programme summary
                  value:
                    items:
                      - eveningid: "9500001"
                        title: "Camp Skills Night"
                        parentsrequired: "1"
                        meetingdate: "2024-11-01"
                        parentsattendingcount: "0"
                        primary_leader: false
                programmeSummaryVerbose:
                  summary: Programme summary with verbose=1
                  value:
                    items:
                      - eveningid: "9500001"
                        title: "Camp Skills Night"
                        parentsrequired: "1"
                        meetingdate: "2024-11-01"
                        parentsattendingcount: "0"
                        primary_leader: false
                        badges: [ ]
                        unavailable_leaders: 0
                programmeDetails:
                  summary: Programme details (getProgramme with sectionid, termid and eveningid)
                  value:
                    items:
                      - eveningid: "9500001"
                        sectionid: "45001"
                        title: "Camp Skills Night"
                        notesforparents: "Bring a warm coat."
                        notesforhelpingparents: null
                        parentsrequired: "1"
                        games: ""
                        prenotes: ""
                        postnotes: ""
                        leaders: ""
                        meetingdate: "2024-11-01"
                        starttime: "18:00:00"
                        endtime: "19:30:00"
                        primary_leader_id: "1000001"
                        config: null
                        soft_deleted: "0"
                        help:
                          - scoutid: "3100005"
                            scout: "Taylor Wood"
                        unavailableleaders: [ ]
                        activities: [ ]
                        badgelinks: [ ]
                        seasonal_suggestions: [ ]
                programmeParentRotaMembers:
                  summary: Parent rota members
                  value:
                    status: true
                    error: null
                    data:
                      - scoutid: "2015779"
                        firstname: "Robert"
                        lastname: "Baden Powell"
                        photo_guid: "00000000-0000-0000-0000-000000000000"
                        patrol_id: -2
                    meta: [ ]
    post:
      summary: Update programme meeting parts
      tags:
        - Programme
      description: |
        Fields left out of `parts` are unchanged. Unlike `getProgramme`, the
        response is a flat object with no `items` wrapper or `status`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ editEveningParts ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                sectionid:
                  type: string
                eveningid:
                  type: string
                parts:
                  type: string
                  description: |
                    JSON-encoded object of `ProgrammeMeeting` fields to change. Observed:
                    `title`, `prenotes`, `games`, `postnotes`, `notesforparents`.
              required: [ sectionid, eveningid, parts ]
              additionalProperties: true
            examples:
              title:
                summary: Rename a meeting
                value:
                  sectionid: "12345"
                  eveningid: "9464403"
                  parts: "{\"title\":\"Astronomy Night 2\"}"
              clear:
                summary: Clear the notes for parents
                value:
                  sectionid: "12345"
                  eveningid: "9464403"
                  parts: "{\"notesforparents\":\"\"}"
      responses:
        "200":
          description: The full meeting after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgrammeMeeting"
              example:
                eveningid: "9464403"
                sectionid: "12345"
                title: "Astronomy Night"
                notesforparents: "Bring a torch."
                notesforhelpingparents: null
                parentsrequired: "0"
                games: "Stars and planets tag"
                prenotes: "Set up the telescope before the meeting."
                postnotes: ""
                leaders: ""
                meetingdate: "2025-01-21"
                starttime: "17:30:00"
                endtime: "18:45:00"
                primary_leader_id: "1000001"
                config:
                  has_badges: false
                soft_deleted: "0"
                help: [ ]
                unavailableleaders: [ ]
                activities: [ ]
                badgelinks: [ ]
                seasonal_suggestions:
                  - activityid: "10"
                    title: "Team Building"
                    description: "Various team building activities."
