          schema:
            type: string
          description: Section ID.
      responses:
        "200":
          description: Email configuration with events and patrols.
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  result:
                    type: object
                    properties:
                      sectionid:
                        type: string
                      slug:
                        type: string
                        description: Newsletter slug for the section.
                      numemails:
                        type: string
                        description: Number of emails sent (as string).
                      live:
                        type: string
                        enum: [ "0", "1" ]
                        description: Whether the newsletter is live.
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
                    description: Upcoming events that can be used as email filters.
                  patrols:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        slug:
                          type: string
                    description: Patrols/sixes in the section.
                  leaders:
                    type: boolean
                    description: Whether leaders are available as recipients.
                additionalProperties: true
              example:
                found: true
                result:
                  sectionid: "45001"
                  slug: "1stRiversideCubs"
                  numemails: "0"
                  live: "1"
                events:
                  - name: "Summer Camp 2025"
                    slug: "SummerCamp2025"
                  - name: "Investiture Ceremony"
                    slug: "InvestitureCeremony"
                patrols:
                  - name: "Blue"
                    slug: "Blue"
                  - name: "Green"
                    slug: "Green"
                  - name: "Red"
                    slug: "Red"
                  - name: "Yellow"
                    slug: "Yellow"
                leaders: true
  /v3/members/contact/{sectionid}/removalWarnings:
    post:
      summary: Get pre-removal warnings for a member
      tags:
        - Members
      description: |
        Checks whether there are any warnings before removing a member from a
        section (e.g. outstanding payments). Call this before `removeMember`
        to display confirmation prompts to the user.
      parameters:
        - name: sectionid
          in: path
          required: true
          schema:
            type: string
          description: Section ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - "member_ids[0]"
              properties:
                "member_ids[0]":
                  type: integer
                  description: Scout ID of the member to check. Additional members can be sent as `member_ids[1]`, `member_ids[2]`, etc.
            example:
              "member_ids[0]": 3100005
      responses:
        "200":
          description: Removal warnings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  error:
                    nullable: true
                  data:
                    type: object
                    properties:
                      payments:
                        type: boolean
                        description: Whether the member has outstanding payments.
                    additionalProperties: true
                  meta:
                    type: object
                    properties:
                      ok:
                        type: boolean
              example:
                status: true
                error: null
                data:
                  payments: false
                meta:
                  ok: true
  /v3/members/review/deletion/{sectionid}:
    get:
      summary: Get deletable members
