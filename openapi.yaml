                    type: "income"
                    amount: 9706
                    locked: false
                    categorised: 9706
                    number_categories: 2
                    auto_categorisation: "no guess"
                    created_at: "2025-10-10 16:24:16"
                    updated_at: "2025-10-10 16:24:16"
                    categories:
                      - id: 810001
                        category_id: 3
                        item_id: 0
                        transaction_id: 800001
                        amount: 10000
                        category:
                          id: 3
                          section_id: 0
                          name: "Membership Fees"
                          type: "income"
                          icon: "membership"
                        item: null
                      - id: 810002
                        category_id: 30
                        item_id: 0
                        transaction_id: 800001
                        amount: 294
                        category:
                          id: 30
                          section_id: 0
                          name: "Bank Fees"
                          type: "expense"
                          icon: "bank"
                        item: null
                    attachments: 0
                meta:
                  number_transactions: 1
                  total_expense: 294
                  total_income: 10000
                  total_amount: 0
                  categories:
                    - id: 55
                      section_id: 0
                      name: "Admin"
                      type: "expense"
                      icon: "administration"
                      usages: [ ]
                  categories_in_financial_year: [ ]
                  items: [ ]
                  financial_year:
                    start_date: "2025-04-06"
                    end_date: "2026-04-05"
  /v3/finances/accounting/financial_year/cashbook/transactions/section/{sectionid}:
    post:
      summary: Create a cashbook transaction
      tags:
        - Finance
      description: |
        Creates a cashbook entry, usually from an imported bank line
        (`bank_account_transaction_id`). `amount` is in **pence**. `categories`
        is a JSON array splitting the amount across categories:

        | Field | Notes |
        |-------|-------|
        | `category_id` | Category ID (see the `categories` list in cashbook `meta`). |
        | `item_id` | Tracked item, or `0`. |
        | `amount` | Pence. |
        | `description`, `payment_id`, `scheme_id`, `is_fee` | Present when the split comes from an online payment payout. |

        `attachments_id` is a client-generated GUID used to upload receipts via
        the cashbook uploads manifest before the transaction exists.
      parameters:
        - $ref: "#/components/parameters/SectionIdPath"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ description, type, date, amount, categories ]
              properties:
                description:
                  type: string
                type:
                  type: string
                  enum: [ income, expense ]
                date:
                  type: string
                  format: date
                amount:
                  type: integer
                  description: Pence.
                categories:
                  type: string
                  description: JSON array of category splits.
                attachments_id:
                  type: string
                  format: uuid
                bank_account_transaction_id:
                  type: string
            example:
              description: "PAYOUT REF EXAMPLE-0002"
              type: income
              date: "2025-04-29"
              amount: 2411
              categories: "[{\"category_id\":3,\"item_id\":0,\"amount\":2500},{\"category_id\":30,\"item_id\":0,\"amount\":89,\"is_fee\":true}]"
              attachments_id: "00000000-0000-0000-0000-000000000002"
              bank_account_transaction_id: "900002"
      responses:
        "200":
          description: Created transaction, with the category OSM would have guessed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V3Envelope"
              example:
                status: true
                error: null
                data:
                  id: 800002
                  guessed_category_id: 3
                  guessed_item_id: 0
                meta: [ ]
  /v3/finances/accounting/financial_year/cashbook/transactions/{transactionId}:
    post:
      summary: Update a cashbook transaction
      tags:
        - Finance
      description: |
        Same body as create. When editing existing splits, each entry in
        `categories` includes its `id` (and the other fields returned by the
        cashbook list).
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
          description: Cashbook transaction ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
            example:
              description: "PAYOUT REF EXAMPLE-0001"
              type: income
              date: "2025-10-08"
              amount: 9706
              categories: "[{\"id\":810001,\"category_id\":3,\"item_id\":0,\"amount\":10000},{\"id\":810002,\"category_id\":30,\"item_id\":0,\"amount\":294}]"
      responses:
        "200":
          description: Transaction updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V3Envelope"
              example:
                status: true
                error: null
                data: [ ]
                meta: [ ]
