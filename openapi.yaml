    get:
      summary: Get next things dashboard data
      tags:
        - Dashboard
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getNextThings ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: true
          schema:
            type: string
          description: Term ID.
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [ squirrels, beavers, cubs, scouts, explorers, adults ]
          description: Section type.
        - name: parts
          in: query
          required: false
          schema:
            type: string
            enum: [ core, agenda, section_widgets, user_widgets ]
          description: |
            Returns only one slice of the dashboard. The web UI now makes four
            requests, one per part; every response echoes `parts` back. Keys
            observed per part:

            | `parts` | Keys returned |
            |---------|---------------|
            | `core` | `is_full_admin`, `duplicate_admin_names`, `permissions` |
            | `agenda` | `conf`, `patrols`, `birthdays`, `programme`, `events` |
            | `section_widgets` | `notepad`, `subscription_expiring_soon`, `members`, `outstandingpayments`, `shop_orders_to_dispatch`, `badge_homework`, `deletable_members`, `due_badges`, `meetings_needing_badge_updates`, `pending_applicant_count`, `thanks` |
            | `user_widgets` | `programme_reviews`, `badge_supplier_review_prompt`, `blocked_expense_card_transactions`, `chat_highlights`, `expense_cards`, `feature_request_voting`, `pending_expense_cardholder_application`, `recommendation`, `unanswered_question`, `user_to_do_tasks`, `whats_new` |

            Omit `parts` to receive the combined response shown in the example.
      responses:
        "200":
          description: Dashboard next things response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardNextThings"
              example:
                conf:
                  birthdays: 1
