  /ext/members/flexirecords/:
    get:
      summary: Get flexi-records, their structure, or their data
      tags:
        - Members
      description: |
        Flexi-records are section-defined spreadsheets of extra per-member data.

        - `getFlexiRecords` — lists the section's flexi-records (`extraid` + `name`).
        - `getStructure` — returns a flexi-record's definition. `config` is a
          JSON-encoded string of column definitions (`[{"id":"f_1","name":"…"}]`)
          and `structure` is the Dojo grid layout (a frozen name block, then the
          editable `f_N` columns).
        - `getData` — returns one row per member for a term, with each custom
          column under its `f_N` key, plus `total` / `completed` summary columns.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getFlexiRecords, getStructure, getData ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: archived
          in: query
          required: false
          schema:
            type: string
            enum: [ y, n ]
          description: "`getFlexiRecords` — include archived flexi-records."
        - name: extraid
          in: query
          required: false
          schema:
            type: string
          description: Flexi-record ID (required for `getStructure` and `getData`).
        - name: termid
          in: query
          required: false
          schema:
            type: string
          description: Term ID (required for `getData`).
        - name: nototal
          in: query
          required: false
          schema:
            type: string
          description: "`getData` — observed sent empty."
      responses:
        "200":
          description: Flexi-record list, structure, or data.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FlexiRecords"
                  - type: object
                    additionalProperties: true
              examples:
