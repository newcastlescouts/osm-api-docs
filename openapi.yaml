  /v3/members/email/draft:
    post:
      summary: Save a draft email
      tags:
        - Email
      description: |
        Autosaves the email being composed. Called repeatedly while editing;
        the `guid` identifies the draft so repeated saves update the same
        record. Returns the draft's ID, which is then passed to `sendTemplate`
        as `draft_email_id`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                subject:
                  type: string
                guid:
                  type: string
                  format: uuid
                section_id:
                  type: string
                campaign_id:
                  type: string
                edits:
                  type: string
                  description: JSON object of template regions (see `sendTemplate`).
            example:
              subject: "Weekly Meeting Reminder"
              guid: "00000000-0000-0000-0000-000000000001"
              section_id: "45002"
              campaign_id: "0"
              edits: "{\"0\":{\"0\":{\"text\":\"<p>Draft text</p>\"}}}"
      responses:
        "200":
          description: Draft saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V3Envelope"
              example:
                status: true
                error: null
                data:
                  id: 80000001
                meta: [ ]
