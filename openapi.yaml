  /ext/generic/locks/:
    post:
      summary: Obtain or clear an edit lock
      tags:
        - Generic
      description: |
        Advisory locks that stop two leaders editing the same thing at once
        (observed for email campaigns, `item=campaign_<campaignId>`).

        - `obtain` — returns a `lock_id`; `duration` is in seconds and the UI
          re-obtains periodically while editing.
        - `clear` — releases a lock by `lock_id`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ obtain, clear ]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                item:
                  type: string
                  description: "`obtain` — what to lock, e.g. `campaign_70001`."
                duration:
                  type: string
                  description: "`obtain` — seconds (observed `60`)."
                read_allowed:
                  type: string
                  enum: [ "true", "false" ]
                  description: "`obtain` — whether others may read while locked."
                write_allowed:
                  type: string
                  enum: [ "true", "false" ]
                  description: "`obtain` — whether others may write while locked."
                type:
                  type: string
                  description: "`obtain` — observed `write`."
                lock_id:
                  type: string
                  description: "`clear` — lock to release."
                section_id:
                  type: string
            examples:
              obtain:
                summary: Obtain a lock
                value:
                  item: "campaign_70001"
                  duration: "60"
                  read_allowed: "false"
                  write_allowed: "false"
                  type: write
                  section_id: "45002"
              clear:
                summary: Clear a lock
                value:
                  lock_id: "9900001"
                  section_id: "45002"
      responses:
        "200":
          description: Lock result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V3Envelope"
              examples:
                obtain:
                  summary: Lock obtained
                  value:
                    status: true
                    error: null
                    data:
                      lock_id: 9900001
                    meta: [ ]
                clear:
                  summary: Lock cleared
                  value:
                    status: true
                    error: null
                    data: [ ]
                    meta: [ ]
