    FileManifestResponse:
      type: object
      description: |
        Shared response for every file-attachment `manifest` action. `manifest`
        is `[]` when empty, otherwise an object keyed by file path. `config`
        describes upload rules; `config.endpoints` maps each operation to the
        `action` value to call on the same URL (or `false` when not permitted).
      properties:
        status:
          type: boolean
        error:
          type: string
          nullable: true
        data:
          type: object
          properties:
            manifest:
              oneOf:
                - type: array
                  maxItems: 0
                  items: { }
                - type: object
                  additionalProperties:
                    type: object
                    properties:
                      upload_id:
                        type: integer
                      path:
                        type: string
                      directory:
                        type: string
                      name:
                        type: string
                      mime:
                        type: string
                      extension:
                        type: string
                      bytes:
                        type: integer
                      size:
                        type: string
                      date_uploaded:
                        type: string
                      preview:
                        type: string
                    additionalProperties: true
            config:
              type: object
              properties:
                endpoints:
                  type: object
                  additionalProperties: { }
                allowed_extensions:
                  type: array
                  items:
                    type: string
                allowed_mime:
                  type: array
                  items:
                    type: string
                max_file_size:
                  nullable: true
                  type: integer
                single_file_size_limit:
                  nullable: true
                  type: integer
                max_files:
                  description: Integer limit, `null`, or `false` when unlimited.
                chunked_uploads:
                  type: boolean
              additionalProperties: true
        meta:
          type: object
          additionalProperties: true
      additionalProperties: true
