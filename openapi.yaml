  /ext/members/email/:
    get:
      summary: Get selected contact emails, or the email attachments manifest
      tags:
        - Email
      description: |
        - `getSelectedEmailsFromContacts` — resolves the email addresses for every
          member in the section using their default contact groups. The web UI
          now sends this as a **POST** with an explicit member list (see below);
          the GET form is kept here as previously observed.
        - `emailerAttachmentsManifest` — returns the attachment manifest for an
          email being composed. The `guid` / `id` identify the draft (the same
          GUID later sent to `sendTemplate` and `/v3/members/email/draft`). See
          [File manifests](#tag/Files) for the response shape.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getSelectedEmailsFromContacts, emailerAttachmentsManifest ]
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID (`getSelectedEmailsFromContacts`).
        - name: section_id
          in: query
          required: false
          schema:
            type: string
          description: Section ID (`emailerAttachmentsManifest`).
        - name: id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Draft email GUID (`emailerAttachmentsManifest`).
        - name: guid
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Draft email GUID — same value as `id` (`emailerAttachmentsManifest`).
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Directory within the manifest (observed `/`).
        - name: temp
          in: query
          required: false
          schema:
            type: string
            enum: [ "true", "false" ]
          description: Include uncommitted (temporary) uploads.
      responses:
        "200":
          description: Selected emails for contacts, or a file manifest.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SelectedContactEmails"
                  - $ref: "#/components/schemas/FileManifestResponse"
              example:
                emails:
                  "3100001":
                    emails:
                      - "parent@example.org"
                      - "guardian@example.org"
                    firstname: "Jamie"
                    lastname: "River"
                    photo_guid: "00000000-0000-0000-0000-000000000000"
                    member_id: 3100001
                count: 2
                blocks: [ ]
                daily_limit_reached: false
    post:
      summary: Resolve recipient emails or send an email
      tags:
        - Email
      description: |
        Two `action` values share this POST endpoint:

        **`getSelectedEmailsFromContacts`** (`sectionid` in the query string) —
        resolves the addresses for a chosen set of members and contact groups.
        Body fields:

        | Field | Format | Notes |
        |-------|--------|-------|
        | `scouts` | comma-separated member IDs | e.g. `3100001,3100002` |
        | `contactGroups` | JSON array of contact group identifiers | e.g. `["contact_primary_1","contact_primary_2","contact_primary_member"]` |

        The response is the same shape as the GET form (keyed by member ID).
        `count` is the number of addresses, not members.

        **`sendTemplate`** — sends (or schedules) an email. `emails` is the JSON
        object returned by `getSelectedEmailsFromContacts` (optionally with an
        `order` per member); `edits` is a JSON object of template regions
        `{ regionId: { blockIndex: { "text": "<html>" } } }`. For a plain email
        the region ID is `"0"`; when a campaign template is used, the region IDs
        are the campaign's `snippet_id`s (see
        `/v3/members/email/campaigns/snippets/{campaignId}`).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getSelectedEmailsFromContacts, sendTemplate ]
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID (required for `getSelectedEmailsFromContacts`).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                scouts:
                  type: string
                  description: "`getSelectedEmailsFromContacts` — comma-separated member IDs."
                contactGroups:
                  type: string
                  description: "`getSelectedEmailsFromContacts` — JSON array of contact group identifiers."
                subject:
                  type: string
                  description: "`sendTemplate` — email subject."
                from:
                  type: string
                  description: "`sendTemplate` — sender, formatted `Display Name <address>`."
                cc:
                  type: string
                  description: "`sendTemplate` — CC addresses (may be empty)."
                save_email_from:
                  type: string
                  enum: [ "true", "false" ]
                  description: "`sendTemplate` — remember `from` as the default sender."
                emails:
                  type: string
                  description: "`sendTemplate` — JSON object of recipients keyed by member ID."
                edits:
                  type: string
                  description: "`sendTemplate` — JSON object of template region content."
                sectionid:
                  type: string
                  description: "`sendTemplate` — section ID."
                current_section_id:
                  type: string
                  description: "`sendTemplate` — section the user is currently viewing."
                campaign_id:
                  type: string
                  description: "`sendTemplate` — campaign template ID, or `0` for a plain email."
                email_session_key:
                  type: string
                  description: "`sendTemplate` — observed `blank`."
                guid:
                  type: string
                  format: uuid
                  description: "`sendTemplate` — draft GUID (ties attachments to the email)."
                draft_email_id:
                  type: string
                  description: "`sendTemplate` — ID returned by `POST /v3/members/email/draft`."
                scheduled_email_id:
                  type: string
                  description: "`sendTemplate` — scheduled email being sent, or `0`."
            examples:
              getSelectedEmailsFromContacts:
                summary: Resolve recipient emails (action=getSelectedEmailsFromContacts)
                value:
                  scouts: "3100001,3100002"
                  contactGroups: "[\"contact_primary_1\",\"contact_primary_2\",\"contact_primary_member\"]"
              sendTemplate:
                summary: Send an email (action=sendTemplate)
                value:
                  cc: ""
                  from: "1st Riverside Cubs <cubs@example.org>"
                  save_email_from: "false"
                  subject: "Weekly Meeting Reminder"
                  emails: "{\"3100001\":{\"firstname\":\"Jamie\",\"lastname\":\"River\",\"member_id\":3100001,\"order\":0,\"photo_guid\":\"00000000-0000-0000-0000-000000000000\",\"emails\":[\"parent@example.org\"]}}"
                  edits: "{\"0\":{\"0\":{\"text\":\"<p>Don't forget to bring your swimming kit this week!</p>\"}}}"
                  sectionid: "45002"
                  current_section_id: "45002"
                  campaign_id: "0"
                  email_session_key: "blank"
                  guid: "00000000-0000-0000-0000-000000000001"
                  draft_email_id: "80000001"
                  scheduled_email_id: "0"
      responses:
        "200":
          description: Selected emails (`getSelectedEmailsFromContacts`) or send confirmation (`sendTemplate`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SelectedContactEmails"
                  - $ref: "#/components/schemas/OkResponse"
              examples:
                sendTemplate:
                  summary: Email sent
                  value:
                    ok: true
  /ext/members/patrols/:
    get:
      summary: Get patrols with members
      tags:
        - Members
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getPatrolsWithPeople ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: true
          schema:
            type: string
          description: Term ID.
        - name: include_no_patrol
          in: query
          required: false
          schema:
            type: string
            enum: [ y, n ]
          description: Include pseudo-patrol for members not in a patrol.
      description: |
        Returns patrols (sixes, lodges, etc.) keyed by patrol ID, each with its
        members. Negative IDs are pseudo-patrols: `-2` = Leaders, `-3` = Young
        Leaders. Members with a rank also carry `patrol_role_level` (the numeric
        rank, matching `patrolleader`) and `patrol_role_level_abbr` (e.g. `6er`,
        `2nd`); the `patrol` field then includes the abbreviation (e.g. `Blue 6er`).
      responses:
        "200":
          description: Patrol list keyed by patrol ID.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                "-3":
                  patrolid: "-3"
                  sectionid: "-2"
                  name: "Young Leaders (YLs)"
                  active: "1"
                  points: "0"
                  census_costs: false
                  members: [ ]
                "-2":
                  patrolid: "-2"
                  sectionid: "-2"
                  name: Leaders
                  active: "1"
                  points: "0"
                  census_costs: false
                  members: [ ]
                "12001":
                  patrolid: "12001"
                  sectionid: "45001"
                  name: Blue
                  active: "1"
                  points: "2"
                  census_costs: false
                  members:
                    - firstname: Jamie
                      lastname: River
                      scout_id: 3100001
                      photo_guid: "00000000-0000-0000-0000-000000000000"
                      patrolid: 12001
                      patrolleader: "2"
                      patrol: "Blue 6er"
                      sectionid: 45001
                      enddate: null
                      age: "10 / 2"
                      patrol_role_level_label: Sixer
                      active: 1
                      scoutid: 3100001
                      patrol_role_level_abbr: "6er"
                      patrol_role_level: 2
                      editable: true
    post:
      summary: Update patrol points
      tags:
        - Members
      description: |
        Sets the points total for a patrol. `points` is the **new total**, not an
        increment. The response body is an empty JSON array on success.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ updatePatrolPoints ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ patrolid, points ]
              properties:
                patrolid:
                  type: string
                  description: Patrol ID.
                points:
                  type: string
                  description: New points total.
            example:
              patrolid: "12001"
              points: "3"
      responses:
        "200":
          description: Empty array on success.
          content:
            application/json:
              schema:
                type: array
                items: { }
              example: [ ]
