  /ext/members/contact/:
    get:
      summary: Get list of members or individual member details
      tags:
        - Members
      description: |
        Retrieves member data. The `action` parameter controls the behavior.
        This endpoint is also used to return full member contact/emergency data
        (use with care for GDPR compliance).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getListOfMembers, getIndividual, getMemberTransfers ]
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: false
          schema:
            type: string
          description: Term ID.
        - name: section
          in: query
          required: false
          schema:
            type: string
            enum: [ squirrels, beavers, cubs, scouts, explorers ]
          description: Section type.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [ dob, firstname, lastname, patrol ]
          description: Sort order for list of members.
        - name: scoutid
          in: query
          required: false
          schema:
            type: string
          description: Member unique identifier.
        - name: context
          in: query
          required: false
          schema:
            type: string
            enum: [ members ]
          description: Context for member detail retrieval.
        - name: mode
          in: query
          required: false
          schema:
            type: string
          description: Display mode (observed value `grid`).
        - name: section_id
          in: query
          required: false
          schema:
            type: string
          description: Section ID (alternate naming).
      responses:
        "200":
          description: Member data response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MembersList"
                  - $ref: "#/components/schemas/MemberDetail"
                  - $ref: "#/components/schemas/MemberTransfers"
                additionalProperties: true
              examples:
                membersList:
                  summary: Members list
                  value:
                    identifier: scoutid
                    photos: true
                    items:
                      - firstname: Jamie
                        lastname: River
                        photo_guid: "00000000-0000-0000-0000-000000000000"
                        patrolid: 12001
                        patrol: Blue
                        sectionid: 45001
                        enddate: null
                        age: "10 / 2"
                        patrol_role_level_label: Sixer
                        active: true
                        scoutid: 3100001
                        full_name: "Jamie River"
                memberDetail:
                  summary: Member detail
                  value:
                    ok: true
                    read_only: [ ]
                    data:
                      scoutid: "3100001"
                      firstname: Jamie
                      lastname: River
                      dob: "2015-04-22"
                      started: "2021-09-01"
                      sectionid: 45001
                      active: true
                    meta: [ ]
                memberTransfers:
                  summary: Member transfers
                  value:
                    status: true
                    error: null
                    data:
                      - direction: from
                        member_id: 3100002
                        firstname: Riley
                        lastname: Park
                        photo_guid: "00000000-0000-0000-0000-000000000000"
                        type: transferred
                        date: "2024-01-15"
                        section_id: 65001
                        section_name:
                          group: "1st Riverside Scouts"
                          section: Scouts
                        section_long: "1st Riverside Scouts: Scouts"
                        mode: outgoing
                        id: "outgoing-123456"
                    meta: [ ]
    post:
      summary: Update a member field or contact details
      tags:
        - Members
      description: |
        Updates a single field on a member record, or updates contact details
        for one of their linked contacts. The `action` query parameter must be
        `update`. The body is sent as `application/x-www-form-urlencoded`.

        **Member field mode** — send `scoutid`, `column`, `value`, `sectionid`,
        `context=members`. Known columns:

        | Column          | Value format | Notes |
        |-----------------|-------------|-------|
        | `firstname`     | string | |
        | `lastname`      | string | |
        | `dob`           | `yyyy-mm-dd` | |
        | `started`       | `yyyy-mm-dd` | Date started Scouting. |
        | `startedsection`| `yyyy-mm-dd` | Date started this section. |
        | `patrolid`      | int | Must also provide `patrolleader` in the same request body. |
        | `patrolleader`  | int | 0 = no rank, 1 = APL/Seconder, 2 = PL/Sixer, 3 = SPL/Senior Sixer. |

        When setting `patrolid`, the body **must also include** `patrolleader`
        (the rank level integer). Conversely, `patrolleader` can be set on its
        own as `column` without changing the patrol.

        **Contact update mode** — send `associated_type=member`,
        `associated_id=<scoutid>`, `group_id=<contact_group>`, `context=members`,
        and `data[field]=value` pairs for each field. Contact group IDs:

        | group_id | Contact |
        |----------|---------|
        | 1 | Primary Contact 1 |
        | 2 | Primary Contact 2 |
        | 3 | Emergency Contact |
        | 4 | Doctor's Surgery |
        | 6 | Member's own details |
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ update ]
          description: Must be `update`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                scoutid:
                  type: integer
                  description: Member unique identifier (member field mode).
                column:
                  type: string
                  enum: [ firstname, lastname, dob, started, startedsection, patrolid, patrolleader ]
                  description: The field to update (member field mode).
                value:
                  oneOf:
                    - type: integer
                    - type: string
                  description: The new value.
                sectionid:
                  type: string
                  description: Section ID the member belongs to.
                context:
                  type: string
                  enum: [ members ]
                  description: Must be `members`.
                patrolleader:
                  type: integer
                  description: |
                    Required when `column=patrolid`. Rank level:
                    0 = none, 1 = APL/Seconder, 2 = PL/Sixer, 3 = SPL/Senior Sixer.
                associated_type:
                  type: string
                  enum: [ member ]
                  description: Contact update mode — must be `member`.
                associated_id:
                  type: integer
                  description: Contact update mode — the member's scoutid.
                group_id:
                  type: integer
                  enum: [ 1, 2, 3, 4, 6 ]
                  description: Contact update mode — contact group ID.
            examples:
              memberFieldUpdate:
                summary: Update a member field (e.g. patrol)
                value:
                  scoutid: 3100001
                  column: patrolid
                  value: "12002"
                  sectionid: "45001"
                  context: members
                  patrolleader: 0
              contactUpdate:
                summary: Update a contact's details
                value:
                  associated_type: member
                  associated_id: "3100001"
                  group_id: "1"
                  context: members
                  "data[firstname]": "Sarah"
                  "data[lastname]": "River"
                  "data[email1]": "sarah.river@example.org"
                  "data[phone1]": "07700900123"
                  "data[phone1_sms]": "yes"
      responses:
        "200":
          description: Update confirmation with last-updated metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  meta:
                    type: object
                    properties:
                      last_updated:
                        type: string
                        description: Timestamp of the update (e.g. `2025-09-15 19:42:10`).
                      last_updated_by_name:
                        type: string
                        description: Name of the user who made the update.
                additionalProperties: true
              example:
                ok: true
                meta:
                  last_updated: "2025-09-15 19:42:10"
                  last_updated_by_name: "Alex Scout"
  /ext/members/contact/actions/:
    post:
      summary: Create, remove, or restore a member
      tags:
        - Members
      description: |
        Member lifecycle actions. The `action` query parameter controls the
        behaviour. Body is `application/x-www-form-urlencoded`.

        **`newMember`** — creates a new member in the section.

        **`removeMember`** — removes a member from the section. The `type`
        field controls how much data is retained:

        | type | Effect |
        |------|--------|
        | `keepall` | Keep all data intact |
        | `keepcontact` | Remove personal details except name and core details |
        | `keepname` | Remove personal details except name |
        | `delete` | Remove all personal details; use initials for names (member history retains names) |
        | `erase` | Remove all personal details **including** names from history. **Irreversible.** |

        When `type=erase`, an optional `additional_data_to_delete` array can
        specify extra data categories to purge: `badge`, `events`, `finance`,
        `register`. Each is optional.

        **`returnMember`** — restores a previously removed member.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ newMember, removeMember, returnMember ]
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID (required for `removeMember`).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                firstname:
                  type: string
                  description: "`newMember` only. First name."
                lastname:
                  type: string
                  description: "`newMember` only. Last name."
                dob:
                  type: string
                  format: date
                  description: "`newMember` only. Date of birth (`yyyy-mm-dd`)."
                startedsection:
                  type: string
                  format: date
                  description: "`newMember` only. Date started in this section."
                started:
                  type: string
                  format: date
                  description: "`newMember` only. Date started Scouting."
                sectionid:
                  type: string
                  description: Section ID.
                originating_section_id:
                  type: string
                  description: "`newMember` only. Usually same as `sectionid`."
                term_id:
                  type: string
                  description: "`newMember` only. Term ID."
                scouts:
                  type: integer
                  description: "`removeMember` / `returnMember`. Member scout ID."
                from_section:
                  type: string
                  description: "`removeMember` only. Section ID to remove from."
                date:
                  type: string
                  format: date
                  description: "`removeMember` only. Effective removal date (`yyyy-mm-dd`)."
                type:
                  type: string
                  enum: [ keepall, keepcontact, keepname, delete, erase ]
                  description: "`removeMember` only. Data retention level."
                additional_data_to_delete:
                  type: array
                  items:
                    type: string
                    enum: [ badge, events, finance, register ]
                  description: "`removeMember` with `type=erase` only. Extra data to purge."
            examples:
              newMember:
                summary: Create a new member
                value:
                  firstname: Robin
                  lastname: Wells
                  dob: "2016-06-15"
                  startedsection: "2025-09-05"
                  started: "2025-09-06"
                  sectionid: "45001"
                  originating_section_id: "45001"
                  term_id: "67890"
              removeMember:
                summary: Remove a member (keep all data)
                value:
                  scouts: 3100005
                  from_section: "45001"
                  date: "2025-08-19"
                  type: keepall
              returnMember:
                summary: Restore a removed member
                value:
                  scouts: 3100005
      responses:
        "200":
          description: Action result.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: "`newMember` response."
                    properties:
                      result:
                        type: string
                        enum: [ ok ]
                      out_of_term:
                        type: boolean
                        description: Whether the start date falls outside the given term.
                      scoutid:
                        type: integer
                        description: The newly assigned member ID.
                      firstname:
                        type: string
                      lastname:
                        type: string
                  - type: object
                    description: "`removeMember` / `returnMember` response."
                    properties:
                      ok:
                        type: boolean
                      scouts:
                        type: array
                        items:
                          type: integer
                        description: Scout IDs affected.
              examples:
                newMember:
                  summary: New member created
                  value:
                    result: ok
                    out_of_term: false
                    scoutid: 3100005
                    firstname: Robin
                    lastname: Wells
                removeMember:
                  summary: Member removed
                  value:
                    ok: true
                    scouts: [ 3100005 ]
                returnMember:
                  summary: Member restored
                  value:
                    ok: true
                    scouts: [ 3100005 ]
  /ext/badges/records/:
    get:
      summary: Get badge records or available badges
      tags:
        - Badges
      description: |
        Returns badge data. The `action` parameter controls the behavior:
        - `getBadgeRecords` — returns per-member completion records for a specific badge.
        - `getAvailableBadges` — returns the list of badges available for a section and type.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getBadgeRecords, getAvailableBadges ]
        - name: section
          in: query
          required: true
          schema:
            type: string
            enum: [ squirrels, beavers, cubs, scouts, explorers ]
          description: Section type.
        - name: section_id
          in: query
          required: true
          schema:
            type: string
          description: Section ID (used with `getAvailableBadges`).
        - name: sectionid
          in: query
          required: false
          schema:
            type: string
          description: Section ID (alternate naming, used with some actions).
        - name: term_id
          in: query
          required: true
          schema:
            type: string
          description: Term ID.
        - name: type_id
          in: query
          required: true
          schema:
            type: string
            enum: [ "1", "2", "3", "4" ]
          description: |
            Badge type ID.
            1 = Challenge, 2 = Activity, 3 = Staged, 4 = Core.
        - name: badge_id
          in: query
          required: false
          schema:
            type: string
          description: Badge ID (required for `getBadgeRecords`).
        - name: badge_version
          in: query
          required: false
          schema:
            type: string
          description: Badge version (required for `getBadgeRecords`).
        - name: payload
          in: query
          required: false
          schema:
            type: string
            enum: [ "1" ]
          description: Include full payload (observed value `1`).
        - name: context
          in: query
          required: false
          schema:
            type: string
            enum: [ none ]
          description: Context (observed value `none` for `getAvailableBadges`).
        - name: member_id
          in: query
          required: false
          schema:
            type: string
          description: Member ID filter (observed value `0` for all members).
      responses:
        "200":
          description: Badge records or available badges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeRecordsResponse"
              examples:
                availableBadges:
                  summary: Available badges list
                  value:
                    status: true
                    error: null
                    data:
                      - badge_id: 1001
                        badge_version: 0
                        name: "Teamwork"
                        picture: "badges/teamwork.png"
                        type_id: 1
                        config: "{}"
                        has_stock: false
                    meta: [ ]
                badgeRecords:
                  summary: Badge records for a specific badge
                  value:
                    status: true
                    error: null
                    data:
                      - scoutid: 3100001
                        firstname: "Jamie"
                        lastname: "River"
                        completed: "1"
                        awarded: "1"
                        status: 1
                    meta: [ ]
