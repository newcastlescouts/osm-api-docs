  /ext/members/attendance/:
    get:
      summary: Get attendance data or badge requirements
      tags:
        - Attendance
      description: |
        Attendance endpoints share this path with different `action` values.
        Use `get` for attendance records or `getAttendanceBadgeRequirements`
        for badge requirements tied to a date.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ get, getAttendanceBadgeRequirements ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: termid
          in: query
          required: false
          schema:
            type: string
          description: Term ID (required for `action=get`).
        - name: section
          in: query
          required: true
          schema:
            type: string
          description: Section type (e.g., `cubs`).
        - name: nototal
          in: query
          required: false
          schema:
            type: string
          description: Toggle total attendance column (observed `true`).
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: Meeting date (required for `action=getAttendanceBadgeRequirements`).
      responses:
        "200":
          description: Attendance or badge requirement response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AttendanceList"
                  - $ref: "#/components/schemas/AttendanceBadgeRequirements"
                additionalProperties: true
              examples:
                attendanceList:
                  summary: Attendance list
                  value:
                    identifier: scoutid
                    label: name
                    items:
                      - "2025-01-07": "Yes"
                        total: 2
                        firstname: "Robert"
                        lastname: "Baden Powell"
                        patrolid: -2
                        active: true
                        scoutid: 2015779
                    meetings:
                      "2025-01-07": "Welcome Back!"
                badgeRequirements:
                  summary: Attendance badge requirements
                  value:
                    - badge_id: "1593"
                      badgeName: "Communicator"
                      column_id: "100542"
                      name: "Code"
                      meetingdate: "2025-01-14"
                      section: "cubs"
                      sectionid: 12345
    post:
      summary: Update attendance
      tags:
        - Attendance
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ update ]
        - name: sectionid
          in: query
          required: true
          schema:
            type: string
        - name: termid
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                scouts:
                  type: string
                  description: JSON array of member IDs.
                selectedDate:
                  type: string
                present:
                  type: string
                section:
                  type: string
                sectionid:
                  type: string
                completedBadges:
                  type: string
                  description: JSON array of badge data.
                customData:
                  type: string
                  description: JSON array of custom data updates.
              required: [ scouts, selectedDate, present, section, sectionid ]
              additionalProperties: true
            example:
              scouts: "[3008213]"
              selectedDate: "2025-01-14"
              present: "Absent"
              section: "cubs"
              sectionid: "12345"
              completedBadges: "[]"
              customData: "[]"
      responses:
        "200":
          description: Attendance update response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /ext/customdata/:
    get:
      summary: Get custom data for a member
      tags:
        - Custom Data
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getData ]
        - name: section_id
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
        - name: associated_id
          in: query
          required: true
          schema:
            type: string
          description: Member ID.
        - name: associated_type
          in: query
          required: true
          schema:
            type: string
            enum: [ member ]
        - name: associated_is_section
          in: query
          required: false
          schema:
            nullable: true
            type: string
          description: Section association flag (observed null).
        - name: varname_filter
          in: query
          required: false
          schema:
            nullable: true
            type: string
          description: Filter by variable name (observed null).
        - name: context
          in: query
          required: true
          schema:
            type: string
            enum: [ members ]
        - name: group_order
          in: query
          required: false
          schema:
            type: string
          description: Group ordering (observed "section").
      responses:
        "200":
          description: Custom data groups and columns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomDataResponse"
              example:
                status: true
                error: null
                data:
                  - group_id: 7
                    group_type: "floating"
                    identifier: "floating"
                    name: "Other"
                    columns:
                      - column_id: 34
                        type: "select"
                        varname: "gender"
                        label: "Gender"
                        value: "Male"
                meta:
                  group_name: "1st Riverside Scouts"
                  section_name: "Cubs"
    post:
      summary: Update custom data for a member
      tags:
        - Custom Data
      description: |
        Updates custom data fields on a member. Two `action` values are supported:

        - `update` — bulk update using `data[field]=value` pairs (e.g. contact details).
        - `updateColumn` — update a single custom data column by `column_id`.

        Column IDs are section-specific. The only well-known core column is
        `column_id=34` for Gender (values: Male, Female, Self-identify,
        Prefer not to say, Other, Unspecified). Other column IDs vary per
        section — inspect HTTP traffic to discover them.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ update, updateColumn ]
        - name: section_id
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
              properties:
                associated_id:
                  type: string
                  description: Member scout ID.
                associated_type:
                  type: string
                  enum: [ member ]
                associated_is_section:
                  type: string
                  description: Section association flag (observed `false`).
                group_id:
                  type: string
                  description: |
                    Custom data group ID. For `update` action this matches
                    the contact group (1–6). For `updateColumn` this is the
                    custom data group containing the column.
                column_id:
                  type: integer
                  description: Column ID to update (`updateColumn` action only).
                value:
                  type: string
                  description: New value for the column (`updateColumn` action only).
                context:
                  type: string
                  enum: [ members ]
            examples:
              bulkUpdate:
                summary: Bulk update contact details (action=update)
                value:
                  associated_id: "3100003"
                  associated_type: "member"
                  group_id: "2"
                  context: "members"
                  service: "desktop"
                  "data[firstname]": "Helen"
                  "data[lastname]": "Park"
              updateColumn:
                summary: Update a single custom column (action=updateColumn)
                value:
                  associated_type: member
                  associated_id: "3100005"
                  associated_is_section: "false"
                  group_id: "7"
                  column_id: 34
                  value: "Male"
                  context: members
      responses:
        "200":
          description: Custom data update response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CustomDataUpdateResponse"
                  - $ref: "#/components/schemas/CustomDataColumnUpdateResponse"
              examples:
                bulkUpdate:
                  summary: Bulk update response
                  value:
                    status: true
                    error: null
                    data:
                      lastname: "Park"
                    meta:
                      last_updated:
                        last_updated: "2025-09-12 18:30:45"
                        last_updated_by_name: "Alex Scout"
                      updated:
                        lastname: "Last Name"
                columnUpdate:
                  summary: Column update response
                  value:
                    status: true
                    error: null
                    data:
                      column_id: 34
                      type: select
                      required: "no"
                      varname: gender
                      label: Gender
                      value: Male
                      is_core: "yes"
                      order: "12"
                    meta:
                      last_updated:
                        last_updated: "2025-09-15 19:43:22"
                        last_updated_by_name: "Alex Scout"
  /ext/audittrail/:
    post:
      summary: Get audit trail for a member
      tags:
        - Members
      description: |
        Returns the audit trail (change history) for a member. Despite being
        a POST, this is a read-only query — the body specifies which member
        to look up. The response contains a chronological list of changes
        including patrol moves, rank promotions, field edits, and section
        additions.

        Each entry has a `type` and `code` describing the kind of change:

        | type | code | Meaning |
        |------|------|---------|
        | `members` | `add` | Member added to section |
        | `details` | `field` | A member field was edited |
        | `details` | `new` | A new detail was added (e.g. consent) |
        | `patrols` | `add-to` | Member added to a patrol/six |
        | `patrol-leader` | `promoted` | Rank promotion or demotion |

        The `summary` field contains HTML with `<strong>` tags highlighting
        names, fields, and values.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ getAuditTrail ]
          description: Must be `getAuditTrail`.
        - name: section_id
          in: query
          required: true
          schema:
            type: string
          description: Section ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - section_id
                - id
                - type
              properties:
                section_id:
                  type: string
                  description: Section ID (repeated in body).
                id:
                  type: string
                  description: Member scout ID.
                type:
                  type: string
                  enum: [ member ]
                  description: Must be `member`.
            example:
              section_id: "45001"
              id: "3100001"
              type: member
      responses:
        "200":
          description: Audit trail entries for the member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditTrailResponse"
              example:
                status: true
                error: null
                data:
                  - date: "15/09/2025 19:42"
                    date_raw: "2025-09-15 19:42:10"
                    summary: "<strong>Jamie River</strong> has had their <strong>Consents: Photographs</strong> added as <strong>Yes</strong> by <strong>Alex Scout</strong>"
                    verbose: ""
                    type: details
                    code: new
                    hidden: false
                  - date: "15/09/2025 19:38"
                    date_raw: "2025-09-15 19:38:31"
                    summary: "<strong>Jamie River</strong> is now a <strong>Sixer</strong> in the Blue six in <strong>Cubs</strong> (previously <strong>Seconder</strong>), changed by <strong>Alex Scout</strong>."
                    verbose: ""
                    type: patrol-leader
                    code: promoted
                    hidden: false
                  - date: "15/09/2025 19:37"
                    date_raw: "2025-09-15 19:37:04"
                    summary: "<strong>Jamie River</strong> was added to the <strong>Blue</strong> six."
                    verbose: ""
                    type: patrols
                    code: add-to
                    hidden: false
                  - date: "15/09/2025 19:35"
                    date_raw: "2025-09-15 19:35:54"
                    summary: "<strong>Alex Scout</strong> updated <strong>Date of Birth</strong> for <strong>Jamie River</strong> from <strong>22/04/2015</strong> to <strong>23/04/2015</strong>"
                    verbose: ""
                    type: details
                    code: field
                    hidden: false
                  - date: "15/09/2025 19:34"
                    date_raw: "2025-09-15 19:34:07"
                    summary: "<strong>Jamie River</strong> has been added to <strong>1st Riverside Scouts: Cubs</strong> by <strong>Alex Scout</strong>."
                    verbose: ""
                    type: members
                    code: add
                    hidden: false
                meta:
                  hidden: false
                  note_types:
                    - notes
                    - received-email
                    - received-phonecall
                    - received-letter
                    - sent-email
                    - sent-phonecall
                    - sent-letter
  /ext/settings/emails/:
    get:
      summary: Get email configuration for a section
      tags:
